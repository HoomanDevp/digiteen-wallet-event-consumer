name: digiteen-event-consumer
services:
  postgres:
    image: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    environment:
      POSTGRES_DB: consumer
      POSTGRES_USER: consumer
      POSTGRES_PASSWORD: local-consumer-development-only
    volumes:
      - consumer-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consumer -d consumer"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.2.5-management@sha256:e43ca03df740d48770641b56ce1a26913c74a31e47c1ed36a58e8d91c10731b9
    environment:
      RABBITMQ_DEFAULT_USER: wallet
      RABBITMQ_DEFAULT_PASS: local-rabbit-development-only
    volumes:
      - consumer-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  wallet-event-consumer:
    image: digiteen-wallet-event-consumer:0.1.0
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/consumer
      DATABASE_USERNAME: consumer
      DATABASE_PASSWORD: local-consumer-development-only
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: wallet
      RABBITMQ_PASSWORD: local-rabbit-development-only
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
volumes:
  consumer-postgres:
    # Keep the original standalone data volume when changing the Compose project name.
    name: digiteen-wallet-consumer_consumer-postgres
  consumer-rabbitmq:
    name: digiteen-wallet-consumer_consumer-rabbitmq
